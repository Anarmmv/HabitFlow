<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - HabitFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <span class="dot"></span>
            HabitFlow
        </div>

        <p class="auth-subtitle">
            Track your habits. Build your future.
        </p>


        <div class="alert-error" th:if="${param.error}">
            Invalid username or password.
        </div>

        <div class="alert-success" th:if="${param.logout}">
            You have been logged out.
        </div>


        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label>Username</label>

                <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                        autofocus>
            </div>


            <div class="form-group">
                <label>Password</label>

                <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required>
            </div>


            <button class="btn-primary" type="submit">
                Sign In →
            </button>

        </form>


        <div class="auth-footer">
            Don't have an account?
            <a th:href="@{/auth/register}">
                Create account
            </a>
        </div>


    </div>

</div>


</body>
</html>
