<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Account - HabitFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">


        <div class="brand">
            <span class="dot"></span>
            HabitFlow
        </div>


        <p class="auth-subtitle">
            Start building better habits today.
        </p>


        <div class="alert-error" th:if="${error}">
            <span th:text="${error}"></span>
        </div>


        <form th:action="@{/auth/register}"
              th:object="${registerRequest}"
              method="post">


            <div class="form-group">

                <label>Username</label>

                <input
                        type="text"
                        th:field="*{username}"
                        class="form-control"
                        placeholder="Choose a username"
                        required>

            </div>



            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        th:field="*{email}"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

            </div>



            <div class="form-group">

                <label>Password</label>

                <input
                        type="password"
                        th:field="*{password}"
                        class="form-control"
                        placeholder="Create a password"
                        required>

            </div>



            <button type="submit" class="btn-primary">
                Create Account →
            </button>


        </form>



        <div class="auth-footer">

            Already have an account?

            <a th:href="@{/login}">
                Sign in
            </a>

        </div>



    </div>

</div>


</body>
</html>
