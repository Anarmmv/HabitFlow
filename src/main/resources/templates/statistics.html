<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Statistics - HabitFlow</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="brand">
            <span class="dot"></span>
            HabitFlow
        </div>

        <div class="menu">

            <a th:href="@{/habits}">
                🏠 Dashboard
            </a>

            <a th:href="@{/habits}">
                📋 Habits
            </a>

            <a class="active">
                📊 Statistics
            </a>

            <a th:href="@{/profile}">
                👤 Profile
            </a>

        </div>

    </aside>


    <main class="content">

        <h1>📊 Statistics</h1>

        <div class="habit-card">

            <div class="habit-grid">

                <div class="habit-card">
                    <h3>📋 Total Habits</h3>
                    <div class="stats">
                        <strong th:text="${totalHabits}">0</strong>
                    </div>
                </div>


                <div class="habit-card">
                    <h3>✅ Active Habits</h3>
                    <div class="stats">
                        <strong th:text="${activeHabits}">0</strong>
                    </div>
                </div>


                <div class="habit-card">
                    <h3>🔥 Completed Days</h3>
                    <div class="stats">
                        <strong th:text="${completedDays}">0</strong>
                    </div>
                </div>


                <div class="habit-card">
                    <h3>🏆 Best Streak</h3>
                    <div class="stats">
                        <strong th:text="${bestStreak}">0</strong>
                    </div>
                </div>

            </div>

        </div>

    </main>


</div>

</body>
</html>
