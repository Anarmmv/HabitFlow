<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>New Habit - HabitFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/style.css}">
</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="brand">
            <span class="dot"></span>
            HabitFlow
        </div>


        <p class="auth-subtitle">
            Create a new habit and start your journey.
        </p>



        <form th:action="@{/habits/new}" method="post">


            <div class="form-group">

                <label>Habit title</label>

                <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Example: Drink water"
                        required>

            </div>



            <div class="form-group">

                <label>Description</label>

                <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Example: Drink 8 glasses of water every day">
                </textarea>

            </div>




            <button type="submit" class="btn-primary">
                Save Habit →
            </button>


        </form>




        <div class="auth-footer">

            <a th:href="@{/habits}">
                ← Back to habits
            </a>

        </div>



    </div>


</div>


</body>
</html>
